name: Publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  docker:
    name: Build and push to Docker Hub
    needs: check
    # A manual run from another branch must not overwrite the published latest image.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Start the image before publishing it. A build can succeed and still produce an image that crashes on
      # boot (a file the bundler failed to copy), and nothing else would notice before people pulled it.
      - name: Build image for a smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: email-node:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 3000:3000 -e SESSION_PASSWORD=smoke-test-session-password-32-chars-min email-node:smoke
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/api/domains > /dev/null && break; sleep 1; done
          if ! curl -sf http://127.0.0.1:3000/api/domains > /dev/null; then
            echo "The image did not start. Its log:" >&2
            docker logs smoke >&2
            exit 1
          fi
          curl -sL http://127.0.0.1:3000/setup | grep -q '/_next/static/' || { echo "The image served no page" >&2; docker logs smoke >&2; exit 1; }
          docker rm -f smoke

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            tonyliuzj/email-node:latest
            tonyliuzj/email-node:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
