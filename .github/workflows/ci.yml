name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  check:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The standalone build is what the Docker image runs. A bundler change once pulled the whole project and
      # a local database into it; fail if that ever happens again.
      - name: Standalone build stays lean
        run: |
          for unwanted in src/lib src/components src/pages/api data tests scripts; do
            if [ -e ".next/standalone/$unwanted" ]; then echo "The standalone build contains $unwanted/" >&2; exit 1; fi
          done
          if find .next/standalone -name '*.db' -not -path '*/node_modules/*' | grep -q .; then echo "A database file is in the standalone build" >&2; exit 1; fi

      # The Docker image runs Next's standalone server, so test that, not `next start`: it has to boot (a file
      # the bundler forgot to copy only shows up as a crash on start), and its pages must hold no inline
      # script. The script policy forbids them, and a page with one loads but nothing on it works. Next's
      # default (Turbopack) build emits one, which is why the build uses webpack.
      - name: Standalone server boots and serves pages without inline scripts
        run: |
          cp -R .next/static .next/standalone/.next/static
          cd .next/standalone
          PORT=3100 HOSTNAME=127.0.0.1 SESSION_PASSWORD=ci-session-password-at-least-32-characters DATABASE_URL="$RUNNER_TEMP/ci.db" node server.js &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:3100/api/domains && break; sleep 1; done
          curl -sf http://127.0.0.1:3100/api/domains > /dev/null || { echo "The standalone server did not start" >&2; exit 1; }
          for route in / /setup /inbox /account /admin/login; do
            page="$(curl -sL "http://127.0.0.1:3100$route")"
            echo "$page" | grep -q '/_next/static/' || { echo "$route did not return a page" >&2; exit 1; }
            inline="$(echo "$page" | tr '\n' ' ' | grep -oE '<script[^>]*>' | grep -v 'src=' | grep -v 'type="application/json"' | wc -l)"
            if [ "$inline" != "0" ]; then echo "$route contains $inline inline script(s), which the CSP blocks" >&2; exit 1; fi
          done
