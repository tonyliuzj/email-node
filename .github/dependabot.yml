version: 2

updates:
  # Application dependencies. Minor and patch updates arrive together in one pull request each week;
  # major versions come separately so they get a proper look.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The base image in the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # The actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
